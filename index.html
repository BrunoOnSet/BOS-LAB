<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F4F5F5"><title>BOS — LAB</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f5;color:#202b2e;font:16px/1.6 'Instrument Sans',system-ui,sans-serif;--accent:#2f5b66;--panel:#fff;--line:#dbe2e3}body.dark{background:#161e21;color:#e8eeef;--panel:#222d31;--line:#3c4b50;--accent:#a3cbd3}main{max-width:920px;margin:auto;padding:20px 16px 48px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand small{display:block;color:var(--accent);font-size:11px;line-height:1}.brand strong{font-size:28px;letter-spacing:-1px;line-height:1}h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:10px 0}h2{font-size:21px;line-height:1.3}h3{font-size:17px;margin-bottom:4px}p{margin:8px 0 16px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--accent);font-weight:700}.intro{margin-bottom:24px}details.module{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.module>summary{display:flex;align-items:center;gap:13px;height:80px;padding:12px 16px}.number{background:#2f5b66;color:white;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none;font-weight:600;font-size:13px}.heading{flex:1;min-width:0;font-weight:700;line-height:1.2}.heading small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:4px}.chevron{font-size:22px;color:var(--accent)}details[open]>summary .chevron{transform:rotate(180deg)}.body{padding:16px;border-top:1px solid var(--line)}.study{padding:16px 0;border-bottom:1px solid var(--line)}.study:last-child{border:0}button,select,input,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer}button.primary{background:#2f5b66;color:white;border:0}textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;resize:vertical}a,.term{color:var(--accent)}.term{border:0;border-bottom:1px dotted currentColor;padding:0;background:none;border-radius:0;display:inline;font-weight:600}dialog{max-width:min(520px,90vw);background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:16px;padding:24px}dialog::backdrop{background:#0008}.art{width:100%;max-height:420px;object-fit:contain;background:#151b1e;border-radius:10px}.hint{font-size:13px;opacity:.78}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.controls label{display:flex;flex-direction:column;font-size:13px}input[type=range]{width:100%;accent-color:#2f5b66}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare canvas{width:100%;background:#202628;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note{border-top:1px solid var(--line);padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;font-size:12px;opacity:.7;margin-top:32px}@media(max-width:480px){.module>summary{padding:10px;height:80px}.heading small{font-size:11px}.compare{grid-template-columns:1fr}}
</style></head><body><main><header><div class="brand"><small>Bruno OnSet</small><strong>LAB</strong></div><button id="theme" aria-label="Changer de thème">Clair / sombre</button></header><div class="intro"><div class="eyebrow">L’ATELIER DU REGARD</div><h1>Apprendre à mieux voir.</h1><p>Observer, questionner, expérimenter. La photographie comme langage, la technique comme outil.</p><span class="hint">Prise de vue · Étalonnage · Culture visuelle</span></div><div id="modules"></div><footer>Made for the set · Bruno Guillard · V0.1</footer></main><dialog id="gloss"><h2 id="termTitle"></h2><p id="termText"></p><button id="closeGloss">Fermer</button></dialog><script>
const terms={
'hiérarchie lumineuse':'Organisation des valeurs lumineuses qui rend certaines zones plus saillantes que d’autres. Elle dépend aussi du contraste avec leur voisinage et du contenu de l’image.',
'espace négatif':'Zone relativement peu occupée autour du sujet. Elle peut isoler, orienter une attente ou donner une place narrative à ce qui est hors champ.',
'contraste local':'Différence de valeurs entre régions voisines, à une échelle spatiale donnée. Il peut être marqué autour du visage même dans une image globalement peu contrastée.',
'taille apparente':'Dimension angulaire de la source vue depuis le sujet. À géométrie comparable, une source plus étendue produit généralement une pénombre plus large.',
'adaptation chromatique':'Ajustement du système visuel à la chromaticité de l’illuminant. Une même couleur physique peut ainsi être perçue différemment selon le contexte.',
'courbe tonale':'Relation entre valeurs d’entrée et de sortie. Sa pente locale détermine la séparation des valeurs à cet endroit, sous réserve de l’espace et de la transformation employés.',
'microcontraste':'Contraste des structures fines à une échelle spatiale donnée ; ce n’est pas une grandeur unique normalisée. Il dépend notamment de l’optique, du traitement et de la restitution.',
'halation':'Halo souvent rougeâtre en photographie argentique, dû notamment à la propagation et réflexion de lumière dans le support ou les couches du film. Une diffusion optique n’est pas le même mécanisme.',
'perspective':'Relations géométriques entre les objets projetés, déterminées par la position du point de vue. Changer de focale sans déplacer la caméra change le champ, pas la perspective géométrique.',
'compression des hautes lumières':'Réduction progressive de la séparation des valeurs élevées lors de leur restitution. Elle ne restaure pas les données écrêtées à la capture.'
};
const sections=[
['Anatomie d’une image','Observer avant d’interpréter',[
['Une femme à la fenêtre — Vermeer','Étudie Femme à la balance (vers 1664). Avant de lire le commentaire, dessine mentalement les trois masses principales. Où ton œil revient-il ?','La fenêtre latérale, le mur sombre et la petite balance organisent des contrastes d’échelles différentes. Le geste minuscule devient central sans devoir être le point le plus lumineux. Observe la relation entre les mains, le visage et le tableau dans le tableau.','https://www.nga.gov/artworks/1236-woman-holding-balance','Johannes Vermeer — Femme à la balance, National Gallery of Art'],
['Un espace qui raconte — Hopper','Observe Nighthawks (1942). Imagine la même scène cadrée depuis l’intérieur du restaurant. Que perd-on ?','Le vitrage crée une séparation entre spectateur et personnages. La rue vide et la continuité du comptoir contribuent à une lecture de distance. La solitude est une interprétation, pas une propriété mesurable du jaune.','https://www.artic.edu/artworks/111628/nighthawks','Edward Hopper — Nighthawks, Art Institute of Chicago'],
['L’image dans le temps','Choisis un plan fixe de trois minutes dans un film que tu possèdes. Regarde-le sans son, puis avec le son.','Note à quel moment un détail devient signifiant. Un cadre ne fonctionne pas indépendamment de sa durée, du montage ni de ce que le spectateur sait déjà.']
]],
['Les émotions de l’image','Explorer sans recettes',[
['Solitude sans obscurité','Construis une image lumineuse dans laquelle le personnage semble isolé.','Compare la position du sujet, les regards des autres personnages et l’espace négatif. Un grand espace peut aussi signifier la liberté : teste les deux lectures.'],
['Tension en pleine journée','Imagine une scène de menace dans un intérieur blanc, sans dominante froide.','Travaille les zones hors champ, la répétition géométrique et une rupture discrète de l’équilibre. Compare avec une version plus contrastée : laquelle sert le récit ?'],
['Intimité sans chaleur','Réalise un portrait intime avec une palette froide.','Teste la proximité du point de vue, la continuité des valeurs du visage et le contraste local. La température de couleur n’est pas une émotion en soi.']
]],
['Laboratoire visuel','Comparer et expérimenter',[]],
['Signatures photographiques','Étudier des choix, pas des recettes',[
['Roger Deakins — Blade Runner 2049','Observe les séquences de Las Vegas : silhouettes, grandes masses et profondeur atmosphérique.','Compare un cadre dominé par une masse colorée avec un cadre qui multiplie les accents. Distingue ce qui est observable des hypothèses de plateau.','https://www.rogerdeakins.com/','Site de Roger Deakins'],
['Claire Mathon — Portrait de la jeune fille en feu','Observe les visages, les fonds et la place des regards dans les scènes intérieures.','Étudie la variation de densité et de texture entre les plans. Ne déduis pas un dispositif précis de la seule douceur apparente.'],
['Christopher Doyle — Chungking Express','Observe comment les espaces urbains et les sources colorées structurent les personnages.','Analyse la relation entre mouvement, durée, reflets et couleur. Essaie une version statique pour isoler ce que le mouvement apporte.']
]],
['Technique et esthétique','Comprendre les mécanismes',[
['Contraste global et contraste local','Deux images peuvent partager les mêmes valeurs extrêmes tout en donnant des sensations de relief très différentes.','Dans Resolve, compare une courbe tonale globale et une correction spatiale douce autour du sujet. Maintiens les extrêmes similaires. Observe les transitions plutôt que le seul waveform.'],
['Taille apparente et direction','Une source proche peut être douce et produire une chute d’éclairement importante sur la profondeur du décor.','Déplace une source de taille fixe et compense l’exposition au visage. Compare les ombres et le fond. La loi en inverse du carré s’applique idéalement à une source ponctuelle en champ libre ; une source étendue proche exige une autre modélisation.'],
['Perspective et focale','Compare deux focales au même point de vue, puis deux focales à cadrage identique en déplaçant la caméra.','Le premier test modifie le champ ; le second modifie les rapports de taille et les occultations. Attention à la distorsion propre à chaque optique.'],
['Couleur et contexte','L’adaptation chromatique et le contraste simultané rendent la perception dépendante de l’environnement.','Place un même aplat neutre sur deux fonds colorés. Mesure ses valeurs numériques et compare ton impression. Ne confonds pas luminance physique et clarté perçue.'],
['Matière et hautes lumières','Distingue microcontraste, halation, diffusion et compression des hautes lumières.','Sur une source non écrêtée, compare courbe tonale, diffusion et réduction de netteté séparément. Une simulation de halo ne récupère pas les détails perdus.']
]],
['Expérimentations','Tourner, étalonner, revenir sur ses choix',[
['Un visage, cinq intentions','Même personne, même décor, même focale, expression constante : sérénité, vulnérabilité, menace, solitude, nostalgie.','Consigne la position des sources, les changements de cadre autorisés, les réglages caméra et les décisions de grade. Demande à un tiers de décrire les images sans connaître tes intentions.'],
['Une scène, trois densités','Dans Resolve, crée trois versions d’un même plan : dense, aérienne et neutre.','Utilise la même transformation de sortie. Observe la lisibilité des ombres, les transitions de peau et le poids des masses. Compare en plein écran à luminosité d’écran constante.'],
['Raccord invisible','Tourne trois axes d’une scène courte et harmonise-les.','Vérifie la continuité des visages, de la direction lumineuse et des fonds. Les scopes sont des indices, pas une preuve de continuité perceptuelle.']
]]];
function el(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}
function annotate(node,s){let keys=Object.keys(terms).sort((a,b)=>b.length-a.length),re=new RegExp('('+keys.join('|')+')','gi');s.split(re).forEach(part=>{let k=part.toLowerCase();if(terms[k]){let b=el('button','term',part);b.onclick=()=>{termTitle.textContent=part;termText.textContent=terms[k];gloss.showModal()};node.append(b)}else node.append(document.createTextNode(part))})}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
const root=document.querySelector('#modules');function module(i,title,sub){let d=el('details','module'),s=el('summary'),h=el('div','heading',title);h.append(el('small','',sub));s.append(el('span','number',String(i).padStart(2,'0')),h,el('span','chevron','⌄'));d.append(s);let b=el('div','body');d.append(b);root.append(d);return b}
sections.forEach(([title,sub,items],i)=>{let b=module(i+1,title,sub);if(i===2){buildLab(b);return}items.forEach(([title,prompt,analysis,url,credit])=>{let a=el('article','study');a.append(el('h3','',title));if(url){let l=el('a','',credit);l.href=url;l.target='_blank';l.rel='noopener';a.append(l)}let p=el('p');annotate(p,prompt);a.append(p);let d=el('details');d.append(el('summary','', 'Voir les pistes d’analyse +'));let q=el('p');annotate(q,analysis);d.append(q);a.append(d);b.append(a)})});
function buildLab(b){b.innerHTML='<p>Importe une photographie personnelle pour comparer des variations de valeurs, de couleur et de cadrage. Ce laboratoire travaille sur une image affichée, pas sur des données RAW ou Log.</p><label>Image personnelle <input id="upload" type="file" accept="image/*"></label><div class="compare"><div><span class="hint">Original</span><canvas id="original" width="640" height="360"></canvas></div><div><span class="hint">Variation</span><canvas id="variation" width="640" height="360"></canvas></div></div><div class="controls" id="controls"></div><div class="actions"><button id="reset">Réinitialiser</button><button id="saveImage" class="primary">Exporter la variation</button></div><p class="hint">Les réglages sont des effets pédagogiques en espace d’affichage, non des corrections colorimétriques calibrées. Le recadrage ne simule pas un déplacement de caméra.</p>';
let src=b.querySelector('#original'),dst=b.querySelector('#variation'),sc=src.getContext('2d'),dc=dst.getContext('2d'),params=[['contrast','Contraste',100,0,200],['brightness','Luminosité',100,20,180],['saturate','Saturation',100,0,200],['temperature','Dominante chaud / froid',0,-50,50],['zoom','Recadrage',100,100,200],['shift','Décalage horizontal',0,-100,100]],inputs={};params.forEach(([k,label,v,min,max])=>{let l=el('label','',label),o=el('span','hint',String(v)),r=el('input');r.type='range';r.min=min;r.max=max;r.value=v;r.oninput=()=>{o.textContent=r.value;draw()};inputs[k]={r,o,v};l.append(o,r);b.querySelector('#controls').append(l)});
function demo(){let g=sc.createLinearGradient(0,0,640,360);g.addColorStop(0,'#aab0a0');g.addColorStop(1,'#283d49');sc.fillStyle=g;sc.fillRect(0,0,640,360);sc.fillStyle='#d0c2a0';sc.fillRect(36,28,150,210);sc.fillStyle='#343c42';sc.fillRect(108,28,8,210);sc.fillStyle='#77786c';sc.fillRect(0,280,640,80);sc.fillStyle='#29363d';sc.beginPath();sc.ellipse(380,360,110,126,0,0,Math.PI*2);sc.fill();let face=sc.createLinearGradient(320,100,440,100);face.addColorStop(0,'#d9b49b');face.addColorStop(1,'#56473f');sc.fillStyle=face;sc.beginPath();sc.ellipse(380,158,58,82,0,0,Math.PI*2);sc.fill();sc.fillStyle='#34302b';sc.beginPath();sc.ellipse(380,99,60,29,0,Math.PI,Math.PI*2);sc.fill();sc.fillRect(350,150,20,3);sc.fillRect(395,150,20,3)}
function draw(){let v=k=>+inputs[k].r.value,z=v('zoom')/100,w=src.width/z,h=src.height/z,x=(src.width-w)*(v('shift')+100)/200;dc.clearRect(0,0,dst.width,dst.height);dc.filter='contrast('+v('contrast')+'%) brightness('+v('brightness')+'%) saturate('+v('saturate')+'%)';dc.drawImage(src,x,(src.height-h)/2,w,h,0,0,dst.width,dst.height);dc.filter='none';let t=v('temperature');if(t){let im=dc.getImageData(0,0,dst.width,dst.height);for(let i=0;i<im.data.length;i+=4){im.data[i]+=t*.65;im.data[i+2]-=t*.65}dc.putImageData(im,0,0)}}
demo();draw();b.querySelector('#upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{let scale=Math.min(1200/im.width,1200/im.height,1);src.width=dst.width=Math.max(1,Math.round(im.width*scale));src.height=dst.height=Math.max(1,Math.round(im.height*scale));sc.drawImage(im,0,0,src.width,src.height);URL.revokeObjectURL(url);draw()};im.onerror=()=>{URL.revokeObjectURL(url);alert('Image illisible')};im.src=url};b.querySelector('#reset').onclick=()=>{Object.values(inputs).forEach(({r,o,v})=>{r.value=v;o.textContent=v});draw()};b.querySelector('#saveImage').onclick=()=>{let a=el('a');a.download='BOS-LAB-variation.png';a.href=dst.toDataURL('image/png');a.click()}}
let journal=module(7,'Carnet personnel','Garder une trace de ses expériences');journal.innerHTML='<label for="entryTitle">Titre de l’expérience</label><input id="entryTitle" style="display:block;width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--panel)" placeholder="Ex. Portrait en lumière froide"><label for="entry">Observations, intentions, réglages, prochaines pistes</label><textarea id="entry" rows="5"></textarea><div class="actions"><button class="primary" id="addNote">Enregistrer</button><button id="exportNotes">Exporter le carnet</button></div><p class="hint">Conservé uniquement dans ce navigateur. Exporte régulièrement tes notes.</p><div id="notes"></div>';let notes=store.get('bos-lab-notes',[]);function renderNotes(){let n=document.querySelector('#notes');n.replaceChildren();notes.forEach((x,i)=>{let a=el('div','note');a.append(el('strong','',x.title),el('div','hint',x.date),el('p','',x.text));let del=el('button','','Supprimer');del.onclick=()=>{if(confirm('Supprimer cette note ?')){let next=notes.filter((_,j)=>j!==i);if(store.set('bos-lab-notes',next)){notes=next;renderNotes()}else alert('Stockage indisponible')}};a.append(del);n.append(a)})}document.querySelector('#addNote').onclick=()=>{let title=entryTitle.value.trim(),text=entry.value.trim();if(!title||!text)return alert('Ajoute un titre et une observation.');let next=[{title,text,date:new Date().toLocaleString('fr-FR')},...notes];if(!store.set('bos-lab-notes',next))return alert('Stockage indisponible');notes=next;entryTitle.value=entry.value='';renderNotes()};document.querySelector('#exportNotes').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'})),a=el('a');a.href=url;a.download='BOS-LAB-carnet.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderNotes();document.body.classList.toggle('dark',store.get('bos-lab-dark',false));document.querySelector('#theme').onclick=()=>store.set('bos-lab-dark',document.body.classList.toggle('dark'));document.querySelector('#closeGloss').onclick=()=>gloss.close();
</script></body></html>
