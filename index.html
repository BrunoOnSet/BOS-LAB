*{box-sizing:border-box}body{margin:0;background:#f4f5f5;color:#202b2e;font:16px/1.6 'Instrument Sans',system-ui,sans-serif;--accent:#2f5b66;--panel:#fff;--line:#dbe2e3}body.dark{background:#161e21;color:#e8eeef;--panel:#222d31;--line:#3c4b50;--accent:#a3cbd3}main{max-width:920px;margin:auto;padding:20px 16px 48px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand small{display:block;color:var(--accent);font-size:11px;line-height:1}.brand strong{font-size:28px;letter-spacing:-1px;line-height:1}h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:10px 0}h2{font-size:21px;line-height:1.3}h3{font-size:17px;margin-bottom:4px}p{margin:8px 0 16px}.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--accent);font-weight:700}.intro{margin-bottom:24px}details.module{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.module>summary{display:flex;align-items:center;gap:13px;height:80px;padding:12px 16px}.number{background:#2f5b66;color:white;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none;font-weight:600;font-size:13px}.heading{flex:1;min-width:0;font-weight:700;line-height:1.2}.heading small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:4px}.chevron{font-size:22px;color:var(--accent)}details[open]>summary .chevron{transform:rotate(180deg)}.body{padding:16px;border-top:1px solid var(--line)}.study{padding:16px 0;border-bottom:1px solid var(--line)}.study:last-child{border:0}button,select,input,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px;cursor:pointer}button.primary{background:#2f5b66;color:white;border:0}textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px;resize:vertical}a,.term{color:var(--accent)}.term{border:0;border-bottom:1px dotted currentColor;padding:0;background:none;border-radius:0;display:inline;font-weight:600}dialog{max-width:min(520px,90vw);background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:16px;padding:24px}dialog::backdrop{background:#0008}.art{width:100%;max-height:420px;object-fit:contain;background:#151b1e;border-radius:10px}.hint{font-size:13px;opacity:.78}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.controls label{display:flex;flex-direction:column;font-size:13px}input[type=range]{width:100%;accent-color:#2f5b66}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare canvas{width:100%;background:#202628;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.note{border-top:1px solid var(--line);padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}footer{text-align:center;font-size:12px;opacity:.7;margin-top:32px}@media(max-width:480px){.module>summary{padding:10px;height:80px}.heading small{font-size:11px}.compare{grid-template-columns:1fr}}

</style></head><body><main><header><div class="brand"><small>Bruno OnSet</small><strong>LAB</strong></div><button id="theme">Clair / sombre</button></header><div class="intro"><div class="eyebrow">L’ATELIER DU REGARD</div><h1>Explorer les possibilités de l’image.</h1><p>Entraîner sa perception. Comprendre les décisions photographiques. Développer un langage visuel.</p><span class="hint">Laboratoire avancé · V0.2</span></div><div id="modules"></div><footer>Made for the set · Bruno Guillard</footer></main><dialog id="gloss"><h2></h2><p></p><button>Fermer</button></dialog><script>
const $=(s,p=document)=>p.querySelector(s), E=(t,c,x)=>{let n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n},store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}};
function module(n,t,s){let d=E('details','module'),h=E('summary'),name=E('div','heading',t);name.append(E('small','',s));h.append(E('span','number',String(n).padStart(2,'0')),name,E('span','chevron','⌄'));let b=E('div','body');d.append(h,b);$('#modules').append(d);return b}
function paragraph(p,t){let x=E('p');x.textContent=t;p.append(x)}
function button(p,t,f){let x=E('button','',t);x.onclick=f;p.append(x);return x}
const glossary={'luminance relative':'Y calculée à partir de composantes RVB linéarisées et de coefficients correspondant aux primaires. Ici : sRGB/Rec.709, blanc normalisé à 1. Ce n’est ni la luminance de scène ni une mesure en cd/m².','contraste simultané':'Le contexte spatial modifie l’apparence d’une zone physiquement inchangée. Le mécanisme ne se réduit pas à une correction de l’exposition.','métamérisme':'Deux stimuli spectralement différents peuvent produire une même réponse pour un observateur donné dans une condition donnée, puis diverger sous une autre condition.','adaptation chromatique':'Ajustement perceptuel à la chromaticité du contexte lumineux, incomplet et dépendant du temps et de la scène.','contraste local':'Variation de valeurs à une échelle spatiale définie. Un résultat dépend de la taille du voisinage et de la méthode de calcul.','chroma':'Distance à l’axe neutre dans un espace donné, à distinguer de la saturation perceptuelle.','clipping':'Écrêtage d’une ou plusieurs composantes. Une image de sortie écrêtée ne prouve pas un écrêtage du RAW.','taille apparente':'Étendue angulaire de la source vue du sujet. La forme, l’orientation et la distribution lumineuse de cette source modifient aussi la pénombre.'};
function annotate(p,t){let re=new RegExp('('+Object.keys(glossary).join('|')+')','gi');t.split(re).forEach(s=>{let k=s.toLowerCase();if(glossary[k]){let b=button(p,s,()=>{$('#gloss h2').textContent=s;$('#gloss p').textContent=glossary[k];$('#gloss').showModal()});b.className='term'}else p.append(document.createTextNode(s))})}
$('#gloss button').onclick=()=>$('#gloss').close();
let b=module(1,'Entraîner son regard','Discrimination, mémoire et adaptation');b.innerHTML='<p>Identifie la variation parmi trois stimuli. Le niveau s’ajuste après deux réponses justes consécutives ou une erreur. Les résultats sont propres à cet écran et à ces conditions, pas un test clinique ni une mesure de compétence artistique.</p><label>Type d’exercice <select id="testType"><option value="tone">Écart de densité</option><option value="warm">Dérive chaud / froid</option><option value="green">Dérive vert / magenta</option><option value="sat">Chroma relative</option></select></label><div id="testStatus" class="hint"></div><div class="stage" id="stage"></div><div id="feedback" class="status" aria-live="polite">Choisis le stimulus différent.</div><div class="toolbar"><button id="next">Essai suivant</button><button id="resetScore">Réinitialiser ce test</button></div><div id="history"></div><div class="study"><h3>Contexte : le piège du contraste simultané</h3><div class="pair"><div style="background:#333;height:140px;display:grid;place-items:center"><div style="width:60px;height:60px;background:#888"></div></div><div style="background:#ddd;height:140px;display:grid;place-items:center"><div style="width:60px;height:60px;background:#888"></div></div></div><p>Les deux centres sont RVB 136,136,136. Avant de corriger une peau trop claire, assombris ou éclaircis temporairement son environnement. Si la sensation change sans toucher au visage, tu as identifié un effet de contexte. Compare ensuite les versions sur un fond neutre.</p></div>';
let scores=store.get('bos-lab-training-v2',{}),answer=0,locked=false,delta=0,base=[],odd=[],levels=[24,18,12,9,6,4,3,2,1],state;function mode(){return $('#testType').value}function current(){return scores[mode()]??(scores[mode()]={level:2,streak:0,total:0,correct:0,best:0})}function history(){let p=$('#history');p.replaceChildren();Object.entries(scores).forEach(([k,v])=>p.append(E('p','hint',({tone:'Densité',warm:'Chaud / froid',green:'Vert / magenta',sat:'Chroma'}[k])+ ' : '+v.correct+'/'+v.total+' · meilleur niveau '+(v.best+1)+'/9')))}function trial(){state=current();locked=false;delta=levels[state.level];answer=Math.floor(Math.random()*3);let l=75+Math.floor(Math.random()*100),s=Math.random()<.5?-1:1;base=mode()==='sat'?[l+24,l,l-24]:[l,l,l];let vector=({tone:[1,1,1],warm:[1,0,-1],green:[-0.5,1,-0.5],sat:[1,0,-1]})[mode()];odd=base.map((v,i)=>Math.max(0,Math.min(255,Math.round(v+s*delta*vector[i]))));$('#stage').replaceChildren();for(let i=0;i<3;i++){let x=button($('#stage'),'',()=>choose(i));x.className='patch';x.style.background='rgb('+(i===answer?odd:base).join(',')+')';x.setAttribute('aria-label','Stimulus '+(i+1))}$('#testStatus').textContent='Niveau '+(state.level+1)+'/9 · '+state.correct+'/'+state.total+' réponses justes';$('#feedback').textContent='Quel stimulus est différent ?';$('#next').disabled=true}
function choose(i){if(locked)return;locked=true;let ok=i===answer;state.total++;if(ok){state.correct++;state.best=Math.max(state.best,state.level);if(++state.streak>=2){state.level=Math.min(8,state.level+1);state.streak=0}}else{state.level=Math.max(0,state.level-1);state.streak=0}store.set('bos-lab-training-v2',scores);$('#feedback').textContent=(ok?'Correct. ':'Le stimulus différent était le '+(answer+1)+'. ')+'Référence RVB '+base.join(', ')+' ; variation '+odd.join(', ')+'. Écart nominal '+delta+' codes sur 255. '+(mode()==='tone'?'Observe les valeurs moyennes avant de regarder les extrêmes.':'Ces écarts numériques ne sont pas perceptuellement uniformes et peuvent aussi modifier la luminance.');[...$('#stage').children].forEach((x,j)=>{x.disabled=true;if(j===answer)x.style.outline='3px solid #2f5b66'});$('#next').disabled=false;history()}
$('#testType').onchange=trial;$('#next').onclick=trial;$('#resetScore').onclick=()=>{if(confirm('Effacer les résultats de cet exercice ?')){delete scores[mode()];store.set('bos-lab-training-v2',scores);trial();history()}};trial();history();
const studies=[
['1917 — Roger Deakins','Lumière motivée, continuité et mouvement','Étudie la traversée nocturne d’Écoust. Les zones lumineuses changent au cours du mouvement ; les ombres deviennent des événements narratifs.','Observe successivement la silhouette, le décor et les variations temporelles. Le plan peut rester lisible sans exposition constante du visage.','Sur un plan marché de 30 secondes, construis trois zones d’exposition volontairement distinctes. Ne compense pas automatiquement le passage entre elles. Compare avec une version où le visage conserve une valeur stable.','https://www.rogerdeakins.com/','Site du chef opérateur ; analyse proposée par LAB, dispositif exact non établi ici.'],
['The Zone of Interest — Łukasz Żal','Distance et refus de la dramatisation','Observe les scènes domestiques dans le jardin et la maison. L’ordinaire visuel coexiste avec une violence largement hors champ.','Le cadre distant peut refuser l’identification émotionnelle immédiate. La retenue photographique n’est pas une absence de choix : elle redistribue le rôle du son et du hors-champ.','Filme une situation inquiétante dans une lumière banale. Réalise une seconde version avec une lumière expressive. Compare laquelle laisse le spectateur construire le malaise.','https://a24films.com/films/the-zone-of-interest','Page officielle du film ; lecture esthétique, pas reconstitution du plateau.'],
['Portrait de la jeune fille en feu — Claire Mathon','Circulation des regards et retenue','Observe la succession des portraits et des contrechamps dans les intérieurs.','Le visage ne doit pas être analysé isolément : le sens de la lumière, de l’axe et de la distance émerge du raccord. Examine la variation du poids des fonds entre deux regards.','Monte quatre plans d’un échange muet. Modifie seulement la densité du fond dans un des contrechamps. Vérifie à quel moment la différence devient une rupture narrative.','https://www.festival-cannes.com/','Référence filmographique ; aucune valeur de diaphragme ou de projecteur déduite.'],
['Nighthawks — Edward Hopper','La lumière comme frontière','Observe le restaurant lumineux et la rue sombre.','La vitre, le cadre dans le cadre et les grandes masses organisent une séparation entre le spectateur et les figures. La clarté du décor n’implique pas la proximité psychologique.','Reproduis le principe avec un personnage derrière une vitre ; compare une version depuis l’intérieur et une depuis l’extérieur.','https://www.artic.edu/artworks/111628/nighthawks','Notice et reproduction du musée.'],
['Femme à la balance — Vermeer','Hiérarchie à plusieurs échelles','Observe les mains, la fenêtre et les masses du tableau.','La petite balance reçoit son importance du geste et de la distribution du contraste, pas uniquement de sa valeur lumineuse.','Compose une image où un objet de faible surface devient narrativement dominant sans être la zone la plus claire.','https://www.nga.gov/artworks/1236-woman-holding-balance','Notice et reproduction de la National Gallery of Art.']];
b=module(2,'Études de cinéma et d’art','Décisions, contraintes et transposition');paragraph(b,'Les fiches séparent la lecture visuelle des faits de production. Cette première sélection propose des analyses et des liens de référence ; elle ne prétend pas encore documenter les dispositifs de tournage.');
studies.forEach(([t,sub,obs,analysis,test,url,source])=>{let a=E('article','study');a.append(E('div','meta',sub),E('h3','',t));[['À observer',obs],['Lecture proposée',analysis],['Transposition sur le plateau ou dans Resolve',test]].forEach(([h,p])=>{a.append(E('h4','',h));let q=E('p');annotate(q,p);a.append(q)});let l=E('a','','Ouvrir la référence');l.href=url;l.target='_blank';l.rel='noopener';a.append(l,E('p','hint',source));b.append(a)});
const principles=[
['Inverser la hiérarchie lumineuse','Le sujet peut rester sombre face à un fond plus clair.','Un contour de silhouette devient lisible par contraste de bord, tandis que les détails internes disparaissent. Le regard peut se porter sur le décor avant de revenir au personnage.','Éclaire le fond en conservant la face au même niveau. Dans Resolve, compare une correction du fond avec une correction du sujet.','Si l’action dépend d’un détail du visage, la silhouette peut supprimer une information indispensable.'],
['Contraste intravisage indépendant du décor','Une image peu contrastée globalement peut contenir un visage fortement modelé.','La taille apparente, la direction et le remplissage déterminent différentes composantes du modelé. La densité générale ne suffit pas à décrire la transition de l’ombre.','Garde le fond et le niveau côté clé constants ; ajoute un négatif côté ombre. Compare avec un réglage de contraste global en étalonnage.','Un négatif peut assombrir des réflexions sur la peau et modifier les brillances : ce n’est pas un simple réglage de courbe.'],
['Profondeur par densité plutôt que par flou','Les plans peuvent se distinguer à diaphragme fermé.','Les différences de valeurs, de contraste local, d’occlusion et de chromaticité structurent la profondeur sans défocalisation.','Établis trois plans nets, puis change uniquement la valeur du plan médian. Compare l’effet d’une inversion clair-sombre-clair.','Des plans de même valeur peuvent fusionner ; une séparation chromatique ou un contour peut néanmoins les distinguer.'],
['Saturation relative','Une couleur devient saillante si son environnement devient moins chromatique.','La saillance dépend de l’écart avec le contexte. Augmenter la saturation du sujet et réduire celle du fond ne sont pas équivalents.','Dans Resolve, isole un objet coloré. Variante A : augmente sa chroma. Variante B : réduis celle du reste. Conserve sa valeur dans la seconde.','Les sélections de teinte peuvent affecter la peau, le bruit ou les transitions ; vérifie le masque.'],
['Dissociation tonale et chromatique','Deux zones de luminance relative voisine peuvent rester séparées par leur couleur.','Le contraste de teinte peut soutenir la séparation quand les valeurs convergent. Le rendu en noir et blanc révèle ce que cette séparation doit à la couleur.','Prélève deux zones dans LAB. Ajuste les valeurs dans Resolve puis compare la version grise et la version couleur.','À faible lumière, sur un écran mal réglé ou avec une vision chromatique différente, cette séparation peut perdre de son efficacité.'],
['Densité sans écrasement','Une image dense peut conserver des transitions dans les basses valeurs.','La position des valeurs et la pente locale de la courbe sont distinctes. Baisser le niveau global n’est pas identique à comprimer les ombres.','Avec une transformation de sortie fixe, compare offset puis courbe personnalisée. Aligne une valeur de référence, observe les variations autour.','Le clipping détruit les distinctions disponibles à la sortie ; ne confonds pas noir profond et disparition de texture.'],
['Contraste de matière sans netteté agressive','Une texture visible n’impose pas de renforcer tous les contours.','Le contraste local dépend de l’échelle. Le renforcement des détails fins et celui des structures moyennes peuvent produire des effets très différents.','Compare Midtone Detail, netteté et contraste global sur une peau et un textile. Garde le niveau de sortie constant autant que possible.','Sur un signal bruité, renforcer les détails peut surtout rendre le bruit visible.'],
['Une palette par rapprochement','Une palette cohérente ne nécessite pas une dominante uniforme.','Rapprocher certaines familles de teintes réduit leur dispersion, tandis que préserver une famille divergente crée un accent.','Compare une dominante générale et un réglage Hue vs Hue ciblant deux familles. Observe le comportement des carnations et des neutres.','Le rapprochement peut supprimer une différence narrative entre objets ou introduire des artefacts de gamut.'],
['Modelé par réflexion spéculaire','La brillance révèle la géométrie d’un matériau indépendamment de son niveau diffus.','Une surface brillante reflète les directions de la source selon sa rugosité. Une grande source peut devenir un grand reflet plutôt qu’un simple éclairage doux.','Photographie un objet sombre brillant avec une petite puis une grande surface lumineuse. Déplace la source et non la caméra.','Une lecture au posemètre incident ne décrit pas à elle seule la forme ou la valeur du reflet.'],
['Éclairage discontinu dans le temps','Le passage entre deux zones de lumière peut porter une information.','Une variation d’exposition interne au plan peut devenir expressive sans constituer une erreur.','Filme un trajet entre trois zones. Compare exposition fixe et compensation progressive ; garde le montage identique.','Une rupture involontaire de visibilité d’un geste peut contredire l’intention.'],
['Ombre colorée sans dominante globale','Une ombre peut recevoir une autre lumière que la zone directement éclairée.','Une ombre est une région privée d’une contribution lumineuse, pas nécessairement de toutes. Les sources secondaires et réflexions modifient son spectre.','Éclaire une surface neutre avec une source chaude et un remplissage froid. Occulte chaque source séparément. Compare à une correction chromatique des ombres.','La correction par plage tonale affecte aussi les objets foncés éclairés par la clé.'],
['Raccord par relation plutôt que par valeur absolue','Deux plans peuvent sembler cohérents malgré des valeurs de peau différentes.','La relation peau-fond, la motivation lumineuse, le contexte et le temps de montage influencent la continuité.','Crée deux raccords : peau alignée au scope, puis relations peau-fond rapprochées. Compare en lecture normale et en arrêt sur image.','Un changement de valeur peut être motivé par le point de vue ; ne normalise pas toutes les différences.']];
b=module(3,'Possibilités photographiques','12 principes à expérimenter');let search=E('input');search.placeholder='Rechercher un principe…';search.style.cssText='width:100%;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px';b.append(search);let list=E('div');b.append(list);function renderPrinciples(){list.replaceChildren();let q=search.value.toLowerCase();principles.filter(a=>a.join(' ').toLowerCase().includes(q)).forEach(([t,idea,why,protocol,limit])=>{let d=E('details','study');d.append(E('summary','',t+' +'));[['Principe',idea],['Mécanisme',why],['Protocole comparatif',protocol],['Limite / contre-exemple',limit]].forEach(([h,s])=>{d.append(E('h4','',h));let p=E('p');annotate(p,s);d.append(p)});list.append(d)})}search.oninput=renderPrinciples;renderPrinciples();
b=module(4,'Analyse d’image','Révéler la structure esthétique');b.innerHTML='<p>Importe une ou deux images d’affichage sRGB. Les analyses utilisent les pixels décodés par le navigateur, après réduction éventuelle. Elles ne mesurent pas la scène, les stops caméra ni la colorimétrie d’un master HDR.</p><div class="pair"><label>Référence A <input type="file" accept="image/*" id="fileA"></label><label>Référence B <input type="file" accept="image/*" id="fileB"></label></div><div class="toolbar" id="modes"></div><div class="pair"><div><canvas id="canA" width="640" height="360"></canvas><div id="readA" class="hint readout"></div><div id="palA" class="swatches"></div></div><div><canvas id="canB" width="640" height="360"></canvas><div id="readB" class="hint readout"></div><div id="palB" class="swatches"></div></div></div><p id="modeHelp" class="status"></p><p class="hint">Clique sur une zone de l’image pour prélever les valeurs du pixel original. La palette représente des familles RVB quantifiées, non des couleurs perceptuellement optimales.</p><div id="sample" class="status">Aucun prélèvement.</div>';
let data={},selected='original';const modes={original:['Original','Image d’affichage décodée.'],gray:['Valeurs','Luminance relative calculée en RVB linéaire sRGB puis réencodée en gris.'],mass:['Masses','Réduction à 12 cellules de large et interpolation : révèle l’organisation grossière, sans segmentation sémantique.'],zones:['Zones','Classes de luminance relative : < 0,03 ; 0,03–0,10 ; 0,10–0,25 ; 0,25–0,60 ; ≥ 0,60. Seuils arbitraires, pas des zones d’exposition caméra.'],chroma:['Chroma RVB','Différence max-min des composantes sRGB codées : indicateur simple, non saturation perceptuelle.'],local:['Contraste local','Écart absolu de luminance relative à une moyenne de voisinage (environ 3 % de la largeur). Amplification visuelle ×4.'],clip:['Extrêmes','Rouge : au moins un canal à 255 ; bleu : tous les canaux à 0. Indice de limites numériques, pas preuve de clipping à la capture.']};
const lin=x=>{x/=255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)},enc=x=>255*(x<=.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-.055),lum=(r,g,b)=>.2126*lin(r)+.7152*lin(g)+.0722*lin(b);
function sourceDemo(){let c=E('canvas');c.width=640;c.height=360;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,640,360);g.addColorStop(0,'#c2ad82');g.addColorStop(1,'#263b48');x.fillStyle=g;x.fillRect(0,0,640,360);x.fillStyle='#e0d5ba';x.fillRect(24,20,170,220);x.fillStyle='#303d44';x.fillRect(100,20,10,220);x.fillStyle='#34444c';x.fillRect(0,280,640,80);x.fillStyle='#282e33';x.beginPath();x.ellipse(410,370,115,140,0,0,7);x.fill();let f=x.createLinearGradient(350,0,460,0);f.addColorStop(0,'#dcb69b');f.addColorStop(1,'#59443c');x.fillStyle=f;x.beginPath();x.ellipse(410,150,58,85,0,0,7);x.fill();return c}
